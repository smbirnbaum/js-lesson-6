<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <main class="container mt-5">
    <h1>Book Tracker</h1>

    <form id="book-form">
      <input id="title" class="form-control mb-2" type="text" placeholder="Book title">
      <input id="author" class="form-control mb-2" type="text" placeholder="Author">
      <button class="btn btn-primary" type="submit">Add book</button>
    </form>

    <section class="mt-4">
      <h2>My Books</h2>
      <ul id="book-list"></ul>
    </section>
  </main>

  <script src="scripts/l6.js"></script>
</body>
</html>
